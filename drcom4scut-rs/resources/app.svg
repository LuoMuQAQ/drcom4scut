<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 31.5 180 180" width="256" height="256" role="img" aria-label="校园网客户端标志-三环互联">
  <defs>
    <!-- 遮罩原理：白底显示 + 黑带擦除。下环在交叉点处被“上环中线±12px的带”切断，
         上环线宽12，被切后两边各留约 6px 均缝，断面由遮罩边界形成锐角 -->
    <mask id="cut0t" maskUnits="userSpaceOnUse" x="-20" y="-20" width="280" height="280">
      <rect x="-20" y="-20" width="280" height="280" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="24">
        <path d="M 133.26 115.08 A 46 46 0 0 1 137.12 146.31"/>
        <path d="M 60.94 102.33 A 46 46 0 0 1 89.92 90.06"/>
      </g>
    </mask>
    <mask id="cut1t" maskUnits="userSpaceOnUse" x="-20" y="-20" width="280" height="280">
      <rect x="-20" y="-20" width="280" height="280" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="24">
        <path d="M 117.63 133.94 A 46 46 0 0 1 88.65 121.67"/>
        <path d="M 164.83 77.69 A 46 46 0 0 1 160.97 108.92"/>
      </g>
    </mask>
    <mask id="cut2t" maskUnits="userSpaceOnUse" x="-20" y="-20" width="280" height="280">
      <rect x="-20" y="-20" width="280" height="280" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="24">
        <path d="M 109.11 110.98 A 46 46 0 0 1 134.23 92.02"/>
        <path d="M 134.23 179.98 A 46 46 0 0 1 109.11 161.02"/>
      </g>
    </mask>
  </defs>
  <g transform="translate(0 9.5)" fill="none" stroke="#0F6CBD" stroke-width="12">
    <!-- 更紧凑版：圆心(120, 88)内聚4px，圆心两两相距约55.4（标准62.4），R=46不变；
         正向压叠：0环压1环、1环压2环、2环压0环；被压处以遮罩锐角切断，共6处压叠缝 -->
    <circle cx="120" cy="88" r="46" mask="url(#cut0t)"/>
    <circle cx="147.713" cy="136" r="46" mask="url(#cut1t)"/>
    <circle cx="92.287" cy="136" r="46" mask="url(#cut2t)"/>
  </g>
</svg>
